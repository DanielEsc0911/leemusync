[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # basic-toml is unmaintained (no vulnerability). It's build-time only: uniffi 0.32.2 ->
  # uniffi_bindgen -> askama 0.16.1 -> askama_derive. No release of those drops it yet.
  # Remove when uniffi updates askama (checked 2026-10-20).
  { id = "RUSTSEC-2026-0374", reason = "unmaintained build-time dep of uniffi's askama; no upgrade yet" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "MPL-2.0", "Unicode-3.0", "Zlib", "CC0-1.0",
]
# Mozilla's root certificates as data. rustls-platform-verifier uses it only
# on wasm32, which LemuSync doesn't ship, but the graph covers every target.
exceptions = [{ crate = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
