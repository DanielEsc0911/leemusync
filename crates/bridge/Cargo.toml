[package]
name = "leemusync-bridge"
description = "UI bindings: flutter_rust_bridge (Dart) and UniFFI (Kotlin/Swift) in one library."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi_bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
uniffi = "0.32.2"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"

# Same version rustls-platform-verifier uses; needed to hand it the JVM.
[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.22", default-features = false }

# The workspace forbids `unsafe_code`. Generated FFI glue needs it, so this
# crate is the one exception (docs/specs/architecture.md, Layers). Everything
# else matches `[workspace.lints]`.
[lints.rust]
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
dbg_macro = "deny"
todo = "deny"
