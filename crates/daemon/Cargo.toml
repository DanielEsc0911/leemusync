[package]
name = "lemusync-daemon"
description = "LemuSync always-on sync daemon."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "lemusyncd"
path = "src/main.rs"

[dependencies]
lemusync-api = { path = "../api" }
lemusync-engine = { path = "../engine" }
lemusync-ipc = { path = "../ipc" }
fluent-bundle = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time", "macros", "signal"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
unic-langid = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
futures-util = { workspace = true }
ksni = { workspace = true }
notify-rust = { workspace = true }
zbus = { workspace = true }

[dev-dependencies]
futures-util = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
